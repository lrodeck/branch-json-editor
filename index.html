<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Branch — structural JSON editor</title>
<meta name="description" content="A JSON editor that works on the tree: select every node at the same structural position and edit them together.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#eaeeef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1214" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaeeef; --panel:#ffffff; --panel2:#f5f8f8; --line:#d3dadc; --lineSoft:#e5eaeb;
  --ink:#141d1d; --dim:#5a6a6c; --faint:#8c999b;
  --accent:#0c6b76; --accentInk:#ffffff; --accentSoft:#d3e9ec;
  --sel:#d9edef; --selLine:#0c6b76;
  --key:#233b4d; --str:#3f6212; --num:#5b21b6; --bool:#9a3412; --nul:#8c999b;
  --warn:#b42318; --ok:#15803d; --mark:#fbe38a;
  --kin:#fbe0ea; --kinLine:#be185d;
  --shadow:0 1px 0 rgba(16,32,32,.05), 0 6px 18px -12px rgba(16,32,32,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1214; --panel:#161b1e; --panel2:#1c2226; --line:#2a3338; --lineSoft:#222a2e;
    --ink:#e5edee; --dim:#96a5a9; --faint:#66757a;
    --accent:#4fd1c5; --accentInk:#052220; --accentSoft:#15383a;
    --sel:#1b3a3d; --selLine:#4fd1c5;
    --key:#c6d7e4; --str:#a6c96f; --num:#c4b5fd; --bool:#fdba74; --nul:#66757a;
    --warn:#fca5a5; --ok:#86efac; --mark:#4b4318;
    --kin:#3d2230; --kinLine:#f0a6c2;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1214; --panel:#161b1e; --panel2:#1c2226; --line:#2a3338; --lineSoft:#222a2e;
  --ink:#e5edee; --dim:#96a5a9; --faint:#66757a;
  --accent:#4fd1c5; --accentInk:#052220; --accentSoft:#15383a;
  --sel:#1b3a3d; --selLine:#4fd1c5;
  --key:#c6d7e4; --str:#a6c96f; --num:#c4b5fd; --bool:#fdba74; --nul:#66757a;
  --warn:#fca5a5; --ok:#86efac; --mark:#4b4318;
  --kin:#3d2230; --kinLine:#f0a6c2;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  font-size:14px; line-height:1.45;
  display:flex; flex-direction:column; min-height:100vh;
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.mono{font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace}

/* ---------- chrome ---------- */
header{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:baseline; gap:8px; font-weight:600; letter-spacing:-.01em}
.brand small{font-weight:400; color:var(--faint); font-size:12px}
.crumbs{display:flex; align-items:center; gap:2px; flex-wrap:wrap; min-width:0; flex:1}
.crumb{
  background:none; border:0; padding:2px 6px; border-radius:5px; color:var(--dim);
  font-family:"IBM Plex Mono", monospace; font-size:12.5px; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.crumb:hover{background:var(--panel2); color:var(--ink)}
.crumb.here{color:var(--ink); font-weight:500}
.crumbSep{color:var(--faint); font-size:11px}
.tools{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.btn{
  background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:5px 9px; font-size:13px; color:var(--ink);
}
.btn:hover{background:var(--panel2); border-color:var(--dim)}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{background:var(--panel); border-color:var(--line)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accentInk); font-weight:500}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--warn)}
.btn.sm{padding:3px 7px; font-size:12px}
.seg{display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--panel)}
.seg button{background:none; border:0; padding:5px 10px; font-size:13px; color:var(--dim)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accentSoft); color:var(--ink); font-weight:500}

.toolbar{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line);
}
.search{display:flex; align-items:center; gap:6px; flex:1; min-width:220px; max-width:520px;
  border:1px solid var(--line); border-radius:6px; padding:3px 8px; background:var(--panel2)}
.search input{flex:1; border:0; background:none; outline:none; padding:3px 0; font-family:"IBM Plex Mono",monospace; font-size:13px}
.search .hint{color:var(--faint); font-size:11.5px; white-space:nowrap}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border-radius:999px;
  background:var(--accentSoft); color:var(--ink); font-size:12px; font-weight:500;
}
.chip button{background:none;border:0;padding:0;color:var(--dim);font-size:13px;line-height:1}

main{flex:1; display:grid; grid-template-columns:minmax(0,1fr) 372px; min-height:0}
.pane{min-width:0; min-height:0; overflow:auto; background:var(--panel)}
#treePane{border-right:1px solid var(--line); padding:8px 0 40vh}
aside{background:var(--panel2); border-left:1px solid var(--line); overflow:auto; min-height:0}

/* ---------- tree ---------- */
.row{
  --d:0;
  position:relative; display:flex; align-items:center; gap:0;
  padding:0 10px 0 calc(34px + var(--d) * 15px);
  height:24px; white-space:nowrap;
  background-image:repeating-linear-gradient(to right, var(--lineSoft) 0 1px, transparent 1px 15px);
  background-size:calc(var(--d) * 15px) 100%; background-position:34px 0; background-repeat:no-repeat;
}
.row:hover{background-color:var(--panel2)}
.row.cursor{box-shadow:inset 2px 0 0 var(--dim)}
.row.sel{background-color:var(--sel); box-shadow:inset 2px 0 0 var(--selLine)}
.row.match .k{background:var(--mark); border-radius:3px}
.row.kin, .row.hkin{background-color:var(--kin); box-shadow:inset 2px 0 0 var(--kinLine)}
.row.kinalt, .row.hkinalt{box-shadow:inset 2px 0 0 var(--kinLine)}
.row.kinalt .k, .row.hkinalt .k{text-decoration:underline dotted var(--kinLine); text-underline-offset:2px}
.tick{
  position:absolute; left:8px; top:5px; width:13px; height:13px; padding:0;
  border:1px solid var(--line); border-radius:3px; background:var(--panel);
}
.row.sel .tick{background:var(--accent); border-color:var(--accent)}
.row.sel .tick::after{content:""; position:absolute; inset:2px; border-radius:1px; background:var(--accentInk)}
.tw{
  position:absolute; left:calc(24px + var(--d) * 15px); top:2px;
  width:16px; height:20px; padding:0; border:0; background:none; color:var(--faint); font-size:10px;
}
.tw:hover{color:var(--ink)}
.k{font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--key); font-weight:500}
.k.idx{color:var(--faint); font-weight:400}
.colon{color:var(--faint); margin:0 6px 0 1px; font-family:"IBM Plex Mono",monospace}
.v{font-family:"IBM Plex Mono",monospace; font-size:13px; padding:1px 3px; border-radius:3px; cursor:text; max-width:52ch; overflow:hidden; text-overflow:ellipsis}
.v:hover{background:var(--accentSoft)}
.v.str{color:var(--str)} .v.num{color:var(--num)} .v.bool{color:var(--bool)} .v.nul{color:var(--nul); font-style:italic}
.v.box{color:var(--dim); cursor:default}
.v.box:hover{background:none}
.count{color:var(--faint); font-family:"IBM Plex Mono",monospace; font-size:12px; margin-left:8px}
.acts{margin-left:10px; display:none; gap:2px}
.row:hover .acts, .row.cursor .acts{display:flex}
.acts button{background:none; border:0; padding:1px 4px; border-radius:4px; color:var(--faint); font-size:12px}
.acts button:hover{background:var(--accentSoft); color:var(--ink)}
.editIn{
  font-family:"IBM Plex Mono",monospace; font-size:13px; border:1px solid var(--accent);
  border-radius:3px; padding:0 3px; background:var(--panel); min-width:80px; outline:none;
}
.empty{padding:24px 16px; color:var(--dim); max-width:56ch}
.more{padding:8px 16px; color:var(--faint); font-size:12.5px}

/* ---------- inspector ---------- */
.sec{border-bottom:1px solid var(--line); padding:12px 14px}
.sec h3{margin:0 0 8px; font-size:13px; font-weight:600; letter-spacing:-.005em}
.sec h3 .n{color:var(--dim); font-weight:400}
.pathbox{
  font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--dim);
  background:var(--panel); border:1px solid var(--lineSoft); border-radius:5px;
  padding:5px 7px; word-break:break-all; margin:0 0 8px;
}
.pathbox b{color:var(--accent); font-weight:600}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.stack{display:flex; flex-direction:column; gap:6px}
.inl{display:flex; gap:6px; align-items:center}
.f{width:100%; border:1px solid var(--line); border-radius:5px; padding:5px 7px; background:var(--panel); font-size:13px; outline:none}
.f.mono{font-family:"IBM Plex Mono",monospace; font-size:12.5px}
.f:focus{border-color:var(--accent)}
textarea.f{resize:vertical; min-height:56px; line-height:1.4}
.lbl{font-size:12px; color:var(--dim)}
.note{font-size:12px; color:var(--dim); margin:6px 0 0}
.preview{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--dim);
  background:var(--panel); border:1px dashed var(--line); border-radius:5px; padding:6px;
  max-height:104px; overflow:auto; margin-top:6px; white-space:pre-wrap; word-break:break-all;
}
.preview .to{color:var(--ok)}
.preview .er{color:var(--warn)}
.prof{width:100%; border-collapse:collapse; font-size:12.5px}
.prof th{text-align:left; font-weight:500; color:var(--faint); font-size:11.5px; padding:0 4px 4px; border-bottom:1px solid var(--lineSoft)}
.prof td{padding:3px 4px; border-bottom:1px solid var(--lineSoft); vertical-align:middle}
.prof td.kk{font-family:"IBM Plex Mono",monospace; color:var(--key); max-width:130px; overflow:hidden; text-overflow:ellipsis}
.prof td.cc{color:var(--dim); white-space:nowrap; font-family:"IBM Plex Mono",monospace; font-size:11.5px}
.prof td.oo{text-align:right; white-space:nowrap}
.prof tr.part td.cc{color:var(--bool)}
.prof button{background:none;border:0;color:var(--faint);padding:1px 3px;border-radius:4px;font-size:11.5px}
.prof button:hover{background:var(--accentSoft); color:var(--ink)}
.types{display:flex; gap:4px; flex-wrap:wrap}
.tbadge{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--dim); border:1px solid var(--lineSoft); border-radius:3px; padding:0 4px}
kbd{font-family:"IBM Plex Mono",monospace; font-size:11px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:0 4px; background:var(--panel); color:var(--dim)}
.keys{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:12px; color:var(--dim); align-items:center}

/* ---------- table view ---------- */
#tablePane{padding:0}
.twrap{overflow:auto; max-width:100%}
table.tbl{border-collapse:separate; border-spacing:0; font-family:"IBM Plex Mono",monospace; font-size:12.5px}
table.tbl th, table.tbl td{border-bottom:1px solid var(--lineSoft); border-right:1px solid var(--lineSoft); padding:0; height:26px}
table.tbl th{
  position:sticky; top:0; z-index:2; background:var(--panel2); text-align:left; padding:4px 8px;
  font-weight:500; color:var(--key); white-space:nowrap; border-bottom:1px solid var(--line);
}
table.tbl th.rowh, table.tbl td.rowh{position:sticky; left:0; z-index:1; background:var(--panel2); color:var(--faint); text-align:right; padding:0 8px; min-width:52px}
table.tbl th.rowh{z-index:3}
table.tbl td input{width:100%; height:26px; border:0; background:none; padding:0 8px; outline:none; font:inherit; color:var(--ink)}
table.tbl td input:focus{background:var(--accentSoft)}
table.tbl td.missing input::placeholder{color:var(--faint); font-style:italic}
table.tbl td.tstr input{color:var(--str)} table.tbl td.tnum input{color:var(--num)}
table.tbl td.tbool input{color:var(--bool)} table.tbl td.tnul input{color:var(--nul)}
table.tbl td.tobject input, table.tbl td.tarray input{color:var(--dim)}
.colbar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel2)}
.rowacts{display:flex; gap:2px; padding:0 6px}
.rowacts button{background:none;border:0;color:var(--faint);padding:0 4px;border-radius:4px}
.rowacts button:hover{background:var(--accentSoft); color:var(--ink)}

/* ---------- tree chart ---------- */
#graphPane{overflow:hidden; display:flex; flex-direction:column; padding:0}
.gbar{display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel2)}
.gbar .lbl{white-space:nowrap}
.gwrap{flex:1; min-height:320px; position:relative; overflow:hidden; background:var(--panel)}
.gwrap svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
.gwrap svg.panning{cursor:grabbing}
.glink{fill:none; stroke:var(--line); stroke-width:1.2}
.glink.on{stroke:var(--selLine); stroke-width:1.8}
.gnode .gbox{fill:var(--panel2); stroke:var(--line); stroke-width:1}
.gnode:hover .gbox{stroke:var(--dim)}
.gnode.sel .gbox{fill:var(--sel); stroke:var(--selLine); stroke-width:1.6}
.gnode.cur .gbox{stroke:var(--accent); stroke-width:1.6}
.gnode.match .gbox{fill:var(--mark)}
.gnode.kin .gbox, .gnode.hkin .gbox{fill:var(--kin); stroke:var(--kinLine); stroke-width:1.4}
.gnode.kinalt .gbox, .gnode.hkinalt .gbox{stroke:var(--kinLine); stroke-width:1.2; stroke-dasharray:3 2}
.sw{display:inline-block; width:8px; height:8px; border-radius:2px; vertical-align:-1px; margin-right:5px}
.gk{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:500; fill:var(--key)}
.gv{font-family:"IBM Plex Mono",monospace; font-size:12px}
.fstr{fill:var(--str)} .fnum{fill:var(--num)} .fbool{fill:var(--bool)} .fnul{fill:var(--nul)} .fbox{fill:var(--dim)}
.gtog circle{fill:var(--panel); stroke:var(--line); stroke-width:1}
.gtog:hover circle{stroke:var(--accent)}
.gtog text{font-family:"IBM Plex Mono",monospace; font-size:9.5px; fill:var(--dim); text-anchor:middle}

/* ---------- raw view ---------- */
#rawPane{padding:12px 14px; display:flex; flex-direction:column; gap:8px}
#rawText{
  flex:1; min-height:50vh; width:100%; resize:vertical;
  font-family:"IBM Plex Mono",monospace; font-size:12.5px; line-height:1.5;
  border:1px solid var(--line); border-radius:7px; padding:10px; background:var(--panel); outline:none;
}
#rawText:focus{border-color:var(--accent)}
.err{color:var(--warn); font-family:"IBM Plex Mono",monospace; font-size:12.5px}

footer{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:6px 14px; border-top:1px solid var(--line); background:var(--panel);
  font-size:12px; color:var(--dim);
}
footer .sp{flex:1}
#toast{
  position:fixed; left:50%; bottom:46px; transform:translate(-50%,8px); opacity:0;
  background:var(--ink); color:var(--panel); padding:7px 12px; border-radius:7px; font-size:12.5px;
  pointer-events:none; transition:opacity .16s, transform .16s; z-index:50; max-width:80vw;
}
#toast.on{opacity:1; transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}

@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr)}
  aside{border-left:0; border-top:1px solid var(--line); max-height:none}
  #treePane{padding-bottom:16px; max-height:52vh}
  .v{max-width:28ch}
}
</style>
</head>
<body>

<header>
  <div class="brand">Branch <small id="fileName">untitled.json</small></div>
  <nav class="crumbs" id="crumbs" aria-label="Focused path"></nav>
  <div class="tools">
    <button class="btn sm" id="undo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
    <button class="btn sm" id="redo" title="Redo (Cmd/Ctrl+Shift+Z)">Redo</button>
    <div class="seg" role="group" aria-label="View">
      <button data-view="tree" aria-pressed="true">Tree</button>
      <button data-view="graph" aria-pressed="false">Chart</button>
      <button data-view="table" aria-pressed="false">Table</button>
      <button data-view="raw" aria-pressed="false">Text</button>
    </div>
    <button class="btn sm" id="openBtn" title="Open a JSON file (Cmd/Ctrl+O)">Open</button>
    <button class="btn sm" id="saveBtn" title="Save (Cmd/Ctrl+S)">Save</button>
    <button class="btn sm" id="saveAsBtn" title="Save as a new file (Cmd/Ctrl+Shift+S)">Save as</button>
    <button class="btn sm" id="copyBtn" title="Copy the whole document">Copy</button>
    <button class="btn sm" id="themeBtn" title="Switch light/dark">◐</button>
  </div>
</header>

<div class="toolbar">
  <div class="search">
    <span class="hint">find</span>
    <input id="q" placeholder="key, value, or path glob e.g. $.catalog[*].price" autocomplete="off" spellcheck="false">
    <span class="hint" id="qCount"></span>
  </div>
  <div class="seg" role="group" aria-label="Search in">
    <button data-qmode="both" aria-pressed="true">Both</button>
    <button data-qmode="key" aria-pressed="false">Keys</button>
    <button data-qmode="value" aria-pressed="false">Values</button>
  </div>
  <button class="btn sm" id="expandAll">Expand all</button>
  <button class="btn sm" id="collapseAll">Collapse</button>
  <button class="btn sm" id="selMatches" hidden>Select matches</button>
  <span class="sp" style="flex:1"></span>
  <span id="selChip" hidden class="chip"><span id="selChipN"></span><button id="selClear" title="Clear selection">✕</button></span>
</div>

<main>
  <section class="pane" id="treePane" tabindex="0" aria-label="JSON tree"></section>
  <section class="pane" id="graphPane" hidden aria-label="Tree chart"></section>
  <section class="pane" id="tablePane" hidden aria-label="Table editor"></section>
  <section class="pane" id="rawPane" hidden aria-label="JSON text">
    <div class="inl">
      <button class="btn primary" id="rawApply">Apply text</button>
      <button class="btn" id="rawFormat">Reformat</button>
      <button class="btn" id="rawMinify">Minify</button>
      <label class="btn" style="display:inline-flex; align-items:center; gap:6px">Open file<input type="file" id="fileIn" accept=".json,.txt,application/json" style="display:none"></label>
      <span class="err" id="rawErr"></span>
    </div>
    <textarea id="rawText" spellcheck="false" wrap="off"></textarea>
  </section>
  <aside id="side" aria-label="Inspector"></aside>
</main>

<footer>
  <span id="stat"></span>
  <span id="fileState"></span>
  <span class="sp"></span>
  <span>Click a row to select · <kbd>Shift</kbd> range · <kbd>Cmd</kbd>/<kbd>Ctrl</kbd> add · <kbd>?</kbd> keys</span>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================ utils ============================ */
const $ = s => document.querySelector(s);
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = v => v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v;
const pkey = p => JSON.stringify(p);
const clone = v => (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v)));
const ident = /^[A-Za-z_$][A-Za-z0-9_$]*$/;

function seg(k, star) {
  if (typeof k === 'number') return star ? '[*]' : '[' + k + ']';
  return ident.test(k) ? '.' + k : '["' + String(k).replace(/"/g, '\\"') + '"]';
}
const pathStr  = p => '$' + p.map(k => seg(k, false)).join('');
const shapeStr = p => '$' + p.map(k => seg(k, true)).join('');

function getAt(root, p) { let c = root; for (const k of p) { if (c === null || typeof c !== 'object') return undefined; c = c[k]; } return c; }
function exists(root, p) {
  if (!p.length) return true;
  const par = getAt(root, p.slice(0, -1));
  if (par === null || typeof par !== 'object') return false;
  const k = p[p.length - 1];

/* ---- history ---- */

/* ============================ tree model ============================ */
function walkAll(val, path, fn) {

  if (t === 'array') val.forEach((v, i) => walkAll(v, path.concat([i]), fn));
  else if (t === 'object') for (const k of Object.keys(val)) walkAll(val[k], path.concat([k]), fn);
}
function computeMatches() {
  st.matches = new Set();
  const q = st.q.trim();
  if (!q) return;
  const isGlob = q.includes('*') || q.startsWith('$');
  const re = isGlob ? globToRe(q) : null;
  const lq = q.toLowerCase();
  walkAll(getAt(st.doc, st.root), st.root, (v, p) => {
    if (!p.length && !st.root.length) return;
    let hit = false;
    if (re) {
      hit = re.test(pathStr(p)) || re.test(shapeStr(p));
    } else {
      const key = String(p[p.length - 1] ?? '');
      const t = T(v);
      const inKey = key.toLowerCase().includes(lq);
      const inVal = (t !== 'object' && t !== 'array') && String(v).toLowerCase().includes(lq);
      hit = st.qmode === 'key' ? inKey : st.qmode === 'value' ? inVal : (inKey || inVal);

function buildRows() {

    for (const mk of st.matches) {
      const p = JSON.parse(mk);
      for (let i = st.root.length; i <= p.length; i++) keep.add(pkey(p.slice(0, i)));
    }
    keep.add(pkey(st.root));
  }
  const rootVal = getAt(st.doc, st.root);
  (function walk(val, path, depth) {
    const k = pkey(path);
    if (keep && !keep.has(k)) return;
    const t = T(val);
    rows.push({ path, pk: k, depth, value: val, type: t, match: st.matches.has(k), shape: shapeStr(path) });
    if ((t === 'object' || t === 'array') && (filtering || !st.collapsed.has(k)) && rows.length < 4000) {
      if (t === 'array') val.forEach((v, i) => walk(v, path.concat([i]), depth + 1));

  rows.forEach((r, i) => {
    const k = r.path[r.path.length - 1];

/* Which key is "in focus" — the node the cursor sits on. Every other visible

function kinFocus() {
  const cur = st.rows[st.cursor];

/* ============================ render: tree ============================ */
function rowHTML(r, i, ki) {

  const k = r.path[r.path.length - 1];

  const kc = kinClass(r, i, ki);

  let keyHTML;
  if (isRoot) keyHTML = '<span class="k idx">' + (st.root.length ? esc(String(k)) : '$') + '</span>';
  else if (typeof k === 'number') keyHTML = '<span class="k idx">' + k + '</span>';
  else keyHTML = '<span class="k">' + esc(k) + '</span>';

  let valHTML;

    const close = r.type === 'array' ? ']' : '}';
    valHTML = coll
      ? '<span class="v box">' + open + ' ' + kids + ' ' + (r.type === 'array' ? (kids === 1 ? 'item' : 'items') : (kids === 1 ? 'key' : 'keys')) + ' ' + close + '</span>'

    '<button data-act="shape" title="Select every node at this structural position">≡</button>',

    r.type === 'array' && kids && T(r.value[0]) === 'object' ? '<button data-act="table" title="Open as a table">▦</button>' : '',

}

/* ============================ selection ============================ */

function selectOnly(pk) { st.selected = new Set([pk]); st.anchor = pk; }

/* ============================ batch operations ============================ */

  if (!ps.length) return;
  mutate('Deleted ' + ps.length + ' nodes', d => {
    for (const p of ps.slice().sort((a, b) => cmpPath(b, a))) {

}
function opUnwrap() {

function addChild(path) {

/* ============================ branch profile ============================ */
function profileOf(path) {
  const v = getAt(st.doc, path);
  const t = T(v);
  if (t !== 'array' && t !== 'object') return null;
  const entries = t === 'array' ? v.map((x, i) => [i, x]) : Object.entries(v);
  const objEntries = entries.filter(([, x]) => T(x) === 'object');
  if (objEntries.length < 2) return null;
  const cols = new Map();
  for (const [k, o] of objEntries) {
    for (const ck of Object.keys(o)) {
      if (!cols.has(ck)) cols.set(ck, { key: ck, count: 0, types: new Set() });
      const c = cols.get(ck); c.count++; c.types.add(T(o[ck]));
    }
  }
  return { path, total: objEntries.length, childKeys: objEntries.map(([k]) => k), cols: Array.from(cols.values()) };
}
function profileTargets(prof, key) {
  const out = [];
  for (const ck of prof.childKeys) {
    const p = prof.path.concat([ck, key]);
    if (exists(st.doc, p)) out.push(p);
  }
  return out;
}

/* ============================ inline editing ============================ */
function focusRowEditor(pk) {
  const i = st.rows.findIndex(r => r.pk === pk);
  if (i < 0) return;
  const row = $('#treePane').querySelector('.row[data-i="' + i + '"]');
  const v = row && row.querySelector('.v[data-act="edit"]');
  if (v) beginEdit(row, st.rows[i]);
}
function beginEdit(rowEl, r) {
  if (r.type === 'object' || r.type === 'array') return;
  const span = rowEl.querySelector('.v');
  if (!span || span.dataset.editing) return;
  const inp = el('input', 'editIn');
  inp.value = r.type === 'string' ? r.value : JSON.stringify(r.value);
  inp.size = Math.max(8, Math.min(60, String(inp.value).length + 2));
  span.replaceWith(inp);
  inp.dataset.editing = '1';
  inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    if (ok) {
      const nv = coerceLike(inp.value, r.value);
      if (JSON.stringify(nv) !== JSON.stringify(r.value)) { mutate(null, d => { if (!r.path.length) return nv; setAt(d, r.path, nv); }); return; }
    }
    render();
  };
  inp.onblur = () => finish(true);
  inp.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    else if (e.key === 'Tab') { e.preventDefault(); finish(true); }
    e.stopPropagation();
  };
}
function beginKeyEdit(pk) {
  const i = st.rows.findIndex(r => r.pk === pk);
  if (i < 0) return;
  const r = st.rows[i];
  if (!r.path.length || typeof r.path[r.path.length - 1] !== 'string') { toast('Array items are numbered, not named'); return; }
  const row = $('#treePane').querySelector('.row[data-i="' + i + '"]');
  const span = row && row.querySelector('.k');
  if (!span) return;
  const old = r.path[r.path.length - 1];
  const inp = el('input', 'editIn');
  inp.value = old; inp.size = Math.max(6, old.length + 2);
  span.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const finish = ok => {
    if (done) return; done = true;
    const nk = inp.value.trim();
    if (ok && nk && nk !== old) {
      mutate(null, d => { const par = getAt(d, r.path.slice(0, -1)); if (par && !Array.isArray(par)) renameKeyIn(par, old, nk); });
    } else render();
  };
  inp.onblur = () => finish(true);
  inp.onkeydown = e => {
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); finish(true); }

/* ============================ tree chart ============================ */
const G = { scale: 1, tx: 24, ty: 24, sig: null, refit: true, drag: null, last: null };
const GSTEP = 30, GNH = 22, GGAP = 46;

function gmeasure(s, bold) {
  if (!gmeasure._c) {
    const c = document.createElement('canvas');
    gmeasure._c = c.getContext('2d');
  }
  gmeasure._c.font = (bold ? '500 ' : '') + '12px "IBM Plex Mono", ui-monospace, monospace';
  return gmeasure._c.measureText(s).width;
}
function gLabel(r) {
  const k = r.path[r.path.length - 1];
  const key = !r.path.length ? '$' : (typeof k === 'number' ? '[' + k + ']' : String(k));
  let val, cls;
  if (r.type === 'object') { val = '{' + Object.keys(r.value).length + '}'; cls = 'fbox'; }
  else if (r.type === 'array') { val = '[' + r.value.length + ']'; cls = 'fbox'; }
  else {
    val = preview(r.value, 26);
    cls = r.type === 'string' ? 'fstr' : r.type === 'number' ? 'fnum' : r.type === 'boolean' ? 'fbool' : 'fnul';
  }
  return { key: key, val: val, cls: cls };
}
function graphLayout(rows) {
  const idx = new Map();
  rows.forEach((r, i) => idx.set(r.pk, i));
  const kids = new Map();
  const parent = new Array(rows.length).fill(-1);
  for (let i = 1; i < rows.length; i++) {
    const ppk = pkey(rows[i].path.slice(0, -1));
    const pi = idx.has(ppk) ? idx.get(ppk) : -1;
    parent[i] = pi;
    if (pi >= 0) { if (!kids.has(pi)) kids.set(pi, []); kids.get(pi).push(i); }
  }
  const labels = rows.map(gLabel);
  const keyW = labels.map(l => gmeasure(l.key, true));
  const boxW = labels.map((l, i) => Math.ceil(15 + keyW[i] + 8 + gmeasure(l.val, false) + 12));
  const depths = rows.map(r => r.depth);
  const maxD = depths.reduce((a, b) => Math.max(a, b), 0);
  const colW = new Array(maxD + 1).fill(40);
  rows.forEach((r, i) => { colW[r.depth] = Math.max(colW[r.depth], boxW[i]); });
  const xs = [], colX = [];
  let acc = 0;
  for (let d = 0; d <= maxD; d++) { colX[d] = acc; acc += colW[d] + GGAP; }
  rows.forEach((r, i) => xs[i] = colX[r.depth]);
  const ys = new Array(rows.length).fill(0);
  let leaf = 0;
  const stack = [[0, false]];
  while (stack.length) {
    const [i, done] = stack.pop();
    const ch = kids.get(i);
    if (!ch || !ch.length) { ys[i] = leaf; leaf += GSTEP; continue; }
    if (done) { ys[i] = (ys[ch[0]] + ys[ch[ch.length - 1]]) / 2; continue; }
    stack.push([i, true]);
    for (let j = ch.length - 1; j >= 0; j--) stack.push([ch[j], false]);
  }
  return { xs, ys, colW, colX, depths, boxW, keyW, labels, kids, parent,
           width: acc - GGAP, height: Math.max(leaf - GSTEP, 0) + GNH };
}
function applyGT() {
  const g = document.getElementById('gRoot');
  if (g) g.setAttribute('transform', 'translate(' + G.tx.toFixed(1) + ',' + G.ty.toFixed(1) + ') scale(' + G.scale.toFixed(3) + ')');
}
function gFit(L, wrap) {
  const cw = wrap.clientWidth || 800, ch = wrap.clientHeight || 500;
  const s = Math.min(1.1, (cw - 56) / Math.max(L.width, 1), (ch - 48) / Math.max(L.height, 1));
  G.scale = Math.max(0.12, Math.min(1.1, s));
  G.tx = 28;
  G.ty = Math.max(24, (ch - L.height * G.scale) / 2);
}
function gZoom(f, cx, cy) {
  const ns = Math.max(0.12, Math.min(3, G.scale * f));
  const wrap = document.querySelector('#graphPane .gwrap');
  if (!wrap) return;
  const r = wrap.getBoundingClientRect();
  const px = (cx === undefined ? r.width / 2 : cx - r.left), py = (cy === undefined ? r.height / 2 : cy - r.top);
  G.tx = px - (px - G.tx) * (ns / G.scale);
  G.ty = py - (py - G.ty) * (ns / G.scale);
  G.scale = ns;

}
function collapseToDepth(d) {
  st.collapsed = new Set();
  if (d !== null) {
    walkAll(getAt(st.doc, st.root), st.root, (v, p) => {
      if ((T(v) === 'object' || T(v) === 'array') && (p.length - st.root.length) >= d) st.collapsed.add(pkey(p));
    });

}
function renderGraph() {
  const pane = $('#graphPane');
  const rows = st.rows;
  pane.innerHTML = '';

  const bar = el('div', 'gbar');

  bar.appendChild(lab);
  [1, 2, 3, 4].forEach(d => {

    b.title = 'Collapse everything deeper than ' + d + ' level' + (d === 1 ? '' : 's');
    b.onclick = () => collapseToDepth(d);

  ball.onclick = () => collapseToDepth(null);
  bar.appendChild(ball);
  const sep = el('span'); sep.style.width = '8px'; bar.appendChild(sep);
  const bfit = el('button', 'btn sm'); bfit.textContent = 'Fit';
  bfit.onclick = () => { G.refit = true; renderGraph(); };
  const bout = el('button', 'btn sm'); bout.textContent = '−'; bout.title = 'Zoom out'; bout.onclick = () => gZoom(1 / 1.25);
  const bin = el('button', 'btn sm'); bin.textContent = '+'; bin.title = 'Zoom in'; bin.onclick = () => gZoom(1.25);

  for (let i = 1; i < rows.length; i++) {

  svg.addEventListener('pointerdown', e => {

function centerCursorGraph() {
  const L = G.last, i = st.cursor;
  if (!L || i >= L.xs.length) return;

  if (!wrap) return;
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const sx = L.xs[i] * G.scale + G.tx, sy = L.ys[i] * G.scale + G.ty;
  if (sx > 60 && sx < cw - 120 && sy > 40 && sy < ch - 40) return;

};
$('#rawFormat').onclick = () => { try { $('#rawText').value = JSON.stringify(JSON.parse($('#rawText').value), null, 2); $('#rawErr').textContent = ''; } catch (e) { $('#rawErr').textContent = e.message; } };
$('#rawMinify').onclick = () => { try { $('#rawText').value = JSON.stringify(JSON.parse($('#rawText').value)); $('#rawErr').textContent = ''; } catch (e) { $('#rawErr').textContent = e.message; } };
$('#fileIn').onchange = e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => { if (!loadDoc(String(fr.result), f.name, null)) $('#rawErr').textContent = 'Not valid JSON'; };
  fr.readAsText(f);
  e.target.value = '';
};

/* ============================ chrome events ============================ */
function setView(v) {
  if (v === 'graph' && st.view !== 'graph') G.refit = true;
  st.view = v;
  $('#treePane').hidden = v !== 'tree';
  $('#graphPane').hidden = v !== 'graph';
  $('#tablePane').hidden = v !== 'table';
  $('#rawPane').hidden = v !== 'raw';
  render();
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll('[data-qmode]').forEach(b => b.onclick = () => { st.qmode = b.dataset.qmode; render(); });
$('#undo').onclick = undo;
$('#redo').onclick = redo;
$('#selClear').onclick = () => { st.selected.clear(); render(); };
$('#selMatches').onclick = () => { st.selected = new Set(st.matches); render(); };
$('#expandAll').onclick = () => { st.collapsed.clear(); G.refit = true; render(); };
$('#collapseAll').onclick = () => {
  st.collapsed = new Set();
  G.refit = true;
  walkAll(getAt(st.doc, st.root), st.root, (v, p) => { if ((T(v) === 'object' || T(v) === 'array') && p.length > st.root.length) st.collapsed.add(pkey(p)); });
  render();
};
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
};
$('#copyBtn').onclick = async () => {
  const text = JSON.stringify(st.doc, null, 2);
  try { await navigator.clipboard.writeText(text); toast('Copied ' + text.length.toLocaleString() + ' characters'); }
  catch (e) { setView('raw'); $('#rawText').select(); toast('Copy blocked — the text is selected, press Cmd/Ctrl+C'); }
};
let qTimer = null;
$('#q').oninput = e => { st.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { st.cursor = 0; render(); }, 140); };
$('#q').onkeydown = e => { if (e.key === 'Escape') { e.target.value = ''; st.q = ''; render(); } e.stopPropagation(); };

/* ============================ files on disk ============================ */
/* Chromium gives us real file handles, so Save overwrites the file you opened.
   Everywhere else this degrades to an upload box and a download. */
const FS = {
  handle: null,
  name: 'untitled.json',
  dirty: false,
  supported: typeof window.showOpenFilePicker === 'function',
  types: [{ description: 'JSON', accept: { 'application/json': ['.json', '.geojson', '.jsonc'] } }]
};
function paintFile() {
  const n = $('#fileName');
  if (n) n.textContent = FS.name + (FS.dirty ? ' •' : '');
  document.title = (FS.dirty ? '• ' : '') + FS.name + ' — Branch';
  const st2 = $('#fileState');
  if (st2) st2.textContent = FS.dirty ? 'unsaved changes' : (FS.handle ? 'saved to ' + FS.name : 'draft, not written to a file');
  $('#saveAsBtn').hidden = !FS.supported;
}
function markDirty() { FS.dirty = true; paintFile(); }
function loadDoc(text, name, handle) {
  let v;
  try { v = JSON.parse(text); }
  catch (e) { toast('Could not parse ' + name + ': ' + e.message); return false; }
  st.doc = v;
  st.root = []; st.selected.clear(); st.collapsed.clear(); st.cursor = 0;
  st.hist = []; st.hi = -1;
  pushHist('Opened ' + name);
  FS.handle = handle || null; FS.name = name; FS.dirty = false;
  persist(); G.refit = true; render(); paintFile();
  toast('Opened ' + name);
  return true;
}
function okToDiscard() {
  if (!FS.dirty) return true;
  try { return window.confirm('Discard unsaved changes to ' + FS.name + '?'); } catch (e) { return true; }
}
async function openFile() {
  if (!okToDiscard()) return;
  if (!FS.supported) { $('#fileIn').click(); return; }
  try {
    const [h] = await window.showOpenFilePicker({ types: FS.types, multiple: false });
    const f = await h.getFile();
    loadDoc(await f.text(), h.name, h);
  } catch (e) { if (e && e.name !== 'AbortError') toast(e.message || 'Could not open that file'); }
}
async function saveFile(asNew) {
  const text = JSON.stringify(st.doc, null, 2);
  if (FS.supported) {
    try {
      let h = FS.handle;
      if (!h || asNew) h = await window.showSaveFilePicker({ suggestedName: FS.name, types: FS.types });
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
      FS.handle = h; FS.name = h.name; FS.dirty = false; paintFile();
      toast('Saved ' + FS.name);
    } catch (e) { if (e && e.name !== 'AbortError') toast('Could not save: ' + (e.message || e.name)); }
    return;
  }
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.href = url; a.download = FS.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  FS.dirty = false; paintFile();
}
$('#openBtn').onclick = openFile;
$('#saveBtn').onclick = () => saveFile(false);
$('#saveAsBtn').onclick = () => saveFile(true);

/* opened from the OS: double-click a .json, or "open with" */
if ('launchQueue' in window && typeof LaunchParams !== 'undefined' && 'files' in LaunchParams.prototype) {
  window.launchQueue.setConsumer(async params => {
    if (!params.files || !params.files.length) return;
    const h = params.files[0];
    try { const f = await h.getFile(); loadDoc(await f.text(), h.name, h); } catch (e) { }
  });
}

/* dropped onto the window */
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', async e => {
  e.preventDefault();
  if (!okToDiscard()) return;
  const dt = e.dataTransfer;
  const it = dt && dt.items && dt.items[0];
  if (it && it.getAsFileSystemHandle) {
    try {
      const h = await it.getAsFileSystemHandle();
      if (h && h.kind === 'file') { const f = await h.getFile(); loadDoc(await f.text(), h.name, h); return; }
    } catch (err) { }
  }
  const f = dt && dt.files && dt.files[0];
  if (f) loadDoc(await f.text(), f.name, null);
});

window.addEventListener('beforeunload', e => {
  if (!FS.dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

/* offline shell */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => { }); });
}

/* ============================ keyboard ============================ */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(e.shiftKey); return; }
  if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openFile(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === '?') { e.preventDefault(); $('#side').scrollTop = $('#side').scrollHeight; return; }
  if (st.view !== 'tree' && st.view !== 'graph') return;
  const r = st.rows[st.cursor];
  const move = n => { st.cursor = Math.max(0, Math.min(st.rows.length - 1, st.cursor + n)); render(); scrollCursor(); };
  switch (e.key) {
    case 'ArrowDown': e.preventDefault(); move(1); break;
    case 'ArrowUp': e.preventDefault(); move(-1); break;
    case 'ArrowRight': if (r && (r.type === 'object' || r.type === 'array')) { e.preventDefault(); if (st.collapsed.has(r.pk)) { st.collapsed.delete(r.pk); render(); } else move(1); } break;
    case 'ArrowLeft':
      if (!r) break; e.preventDefault();
      if ((r.type === 'object' || r.type === 'array') && !st.collapsed.has(r.pk)) { st.collapsed.add(r.pk); render(); }
      else { const pi = st.rows.findIndex(x => x.pk === pkey(r.path.slice(0, -1))); if (pi >= 0) { st.cursor = pi; render(); scrollCursor(); } }
      break;
    case ' ': if (r) { e.preventDefault(); toggle(r.pk); render(); } break;
    case 'Enter':
      if (!r) break;
      e.preventDefault();
      if (st.view === 'graph') { const vi = document.getElementById('nodeVal'); if (vi) { vi.focus(); vi.select(); } }
      else { const rowEl = $('#treePane').querySelector('.row[data-i="' + st.cursor + '"]'); if (rowEl) beginEdit(rowEl, r); }
      break;
    case 'Tab': if (r) { e.preventDefault(); beginKeyEdit(r.pk); } break;
    case 'Escape':
      if (st.selected.size) { st.selected.clear(); render(); }
      else if (st.root.length) { st.root.pop(); st.cursor = 0; render(); }
      break;
    case 'Backspace': case 'Delete':
      if (st.selected.size) { e.preventDefault(); opDelete(); }
      else if (r && r.path.length) { e.preventDefault(); selectOnly(r.pk); opDelete(); }
      break;
    case 'm': if (r) { selectShape(r.path); render(); } break;
    case 's': if (r) { selectSiblings(r.path); render(); } break;
    case 'a': if (r) { selectChildrenOf(r.path.length ? r.path.slice(0, -1) : r.path, true); render(); } break;
    case 'z': if (r) { st.root = r.path.slice(); st.cursor = 0; render(); } break;
  }
});
function scrollCursor() {
  if (st.view === 'graph') { centerCursorGraph(); return; }
  const row = $('#treePane').querySelector('.row.cursor');
  if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
}

/* ============================ main render ============================ */
function render() {
  hoverAt = -1;
  computeMatches();
  buildRows();
  if (st.cursor >= st.rows.length) st.cursor = Math.max(0, st.rows.length - 1);
  if (st.view === 'tree') renderTree();
  else if (st.view === 'graph') renderGraph();
  else if (st.view === 'table') renderTable();
  else renderRaw();
  renderCrumbs();
  renderChrome();
  renderSide();
}

/* ============================ boot ============================ */
const saved = restore();
if (saved !== null && typeof saved !== 'undefined') st.doc = saved;
pushHist('Opened');
st.collapsed.add(pkey(['settings']));
render();
paintFile();
$('#treePane').focus();
</script>
</body>
</html>
